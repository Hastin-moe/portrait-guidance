<!doctype html>
<meta charset="utf-8">
<title>动作预设例图 · 视觉试验</title>
<style>
  body{margin:0;font:15px/1.45 -apple-system,"PingFang SC",sans-serif;background:#f3f2ef;color:#1c1c1a}
  main{max-width:960px;margin:0 auto;padding:28px 20px 48px}
  h1{font-size:22px;font-weight:650;margin:0 0 6px}
  p{margin:0 0 22px;color:#5c5a55}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  figure{margin:0;background:#fff;border:1px solid #e4e2dc;border-radius:10px;overflow:hidden}
  img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#fff}
  figcaption{padding:10px 12px;font-size:13px}
  .tag{color:#74726c}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
</style>
<main>
  <h1>动作预设例图 · 视觉试验</h1>
  <p>白墙无缝环幕 · 影棚柔光 · 无道具无水印。先看这 3 张规格是否能当「预设调出」缩略图。</p>
  <div class="grid">
    <figure>
      <img src="lookback.jpg" alt="回眸">
      <figcaption><b>回眸</b><div class="tag">pose-back · 近景/特写</div></figcaption>
    </figure>
    <figure>
      <img src="chinrest.jpg" alt="托腮">
      <figcaption><b>托腮</b><div class="tag">pose-chin · 特写/半身</div></figcaption>
    </figure>
    <figure>
      <img src="frontstand.jpg" alt="正面站立">
      <figcaption><b>正面站立</b><div class="tag">sp-stand-front · 全身/七分</div></figcaption>
    </figure>
  </div>
</main>
