<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', 'Apple SD Gothic Neo', 'Noto Sans CJK SC', 'Segoe UI', sans-serif" style="background:#ffffff" viewBox="0 0 760 440" role="img" aria-label="네 하위 모듈이 하나의 프로젝트 데이터를 공유한다" font-size="11.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8780"></path></marker><marker id="arch-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1b">네 하위 모듈이 하나의 프로젝트 데이터를 공유한다</text><g><rect x="24" y="56" width="712" height="152" rx="8" fill="#f2f0eb" stroke="#8a8780" stroke-width="1"></rect><text x="720" y="80" text-anchor="end" font-size="13" font-weight="600" fill="#6b6862">모듈 1 · 사전 기획</text></g><g><rect x="24" y="264" width="712" height="152" rx="8" fill="#f2f0eb" stroke="#8a8780" stroke-width="1"></rect><text x="720" y="288" text-anchor="end" font-size="13" font-weight="600" fill="#6b6862">모듈 2 · 현장과 후반</text></g><g><rect x="48" y="104" width="280" height="88" rx="8" fill="none" stroke="#8a8780" stroke-width="1.25"></rect><text x="64" y="128" font-size="13" font-weight="600" fill="#1f1e1b">1 기획안 작성과 정보 입력</text><text x="64" y="144" fill="#1f1e1b">일시 · 장소 · 모델 · 소품</text><text x="64" y="160" fill="#1f1e1b">촬영 공간 조건과 조명 장비 목록</text><text x="64" y="176" fill="#1f1e1b">배치도: 업로드 / 캔버스 / 텍스트</text></g><g><rect x="432" y="104" width="280" height="88" rx="8" fill="none" stroke="#8a8780" stroke-width="1.25"></rect><text x="448" y="128" font-size="13" font-weight="600" fill="#1f1e1b">2 AI 촬영 공간 시각화</text><text x="448" y="144" fill="#1f1e1b">배치 데이터 → 프롬프트 → 생성</text><text x="448" y="160" fill="#1f1e1b">부감 조명도 + 카메라 시점 이미지</text><text x="448" y="176" fill="#1f1e1b">표시해서 수정, 버전 보관</text></g><g><rect x="48" y="312" width="280" height="88" rx="8" fill="none" stroke="#8a8780" stroke-width="1.25"></rect><text x="64" y="336" font-size="13" font-weight="600" fill="#1f1e1b">3 현장 촬영 관리</text><text x="64" y="352" fill="#1f1e1b">샷 리스트 · 포즈 라이브러리</text><text x="64" y="368" fill="#1f1e1b">촬영일 타임라인과 진행 보드</text><text x="64" y="384" fill="#1f1e1b">샷별 시작·완료 시각 기록</text></g><g><rect x="432" y="312" width="280" height="88" rx="8" fill="none" stroke="#8a8780" stroke-width="1.25"></rect><text x="448" y="336" font-size="13" font-weight="600" fill="#1f1e1b">4 촬영별 셀렉트</text><text x="448" y="352" fill="#1f1e1b">샷별 분류 → 기술 필터</text><text x="448" y="368" fill="#1f1e1b">연사 중복 정리 → 그룹 내 순위</text><text x="448" y="384" fill="#1f1e1b">샷 커버 점검</text></g><g fill="none" stroke="#8a8780" stroke-width="1.25"><path d="M328 148H432" marker-end="url(#arch-arrow)"></path><path d="M128 192V312" marker-end="url(#arch-arrow)"></path><path d="M572 192V236H268V312" marker-end="url(#arch-arrow)"></path><path d="M328 336H432" marker-end="url(#arch-arrow)"></path></g><g><path d="M432 376H328" fill="none" stroke="#2f6fd6" stroke-width="2" marker-end="url(#arch-arrow-accent)"></path></g><text x="380" y="140" text-anchor="middle" fill="#6b6862">배치 데이터</text><text x="136" y="262" fill="#6b6862">인원 · 소품 · 조명</text><text x="420" y="228" text-anchor="middle" fill="#6b6862">카메라 시점 이미지</text><text x="380" y="328" text-anchor="middle" fill="#6b6862">번호 + 시간대</text><text x="380" y="396" text-anchor="middle" font-weight="600" fill="#1f1e1b">재촬영</text></svg>