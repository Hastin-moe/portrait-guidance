<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', 'Apple SD Gothic Neo', 'Noto Sans CJK SC', 'Segoe UI', sans-serif" style="background:#ffffff" viewBox="0 0 760 440" role="img" aria-label="4 つのサブモジュールを 1 つのプロジェクトデータでつなぐ" font-size="11.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8780"></path></marker><marker id="arch-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1b">4 つのサブモジュールを 1 つのプロジェクトデータでつなぐ</text><g><rect x="24" y="56" width="712" height="152" rx="8" fill="#f2f0eb" stroke="#8a8780" stroke-width="1"></rect><text x="720" y="80" text-anchor="end" font-size="13" font-weight="600" fill="#6b6862">モジュール 1 · 事前企画</text></g><g><rect x="24" y="264" width="712" height="152" rx="8" fill="#f2f0eb" stroke="#8a8780" stroke-width="1"></rect><text x="720" y="288" text-anchor="end" font-size="13" font-weight="600" fill="#6b6862">モジュール 2 · 現場と撮影後</text></g><g><rect x="48" y="104" width="280" height="88" rx="8" fill="none" stroke="#8a8780" stroke-width="1.25"></rect><text x="64" y="128" font-size="13" font-weight="600" fill="#1f1e1b">1 企画書の作成と情報入力</text><text x="64" y="144" fill="#1f1e1b">日時 · 場所 · モデル · 小道具</text><text x="64" y="160" fill="#1f1e1b">会場の条件と照明機材リスト</text><text x="64" y="176" fill="#1f1e1b">配置図：アップロード / キャンバス / 文章</text></g><g><rect x="432" y="104" width="280" height="88" rx="8" fill="none" stroke="#8a8780" stroke-width="1.25"></rect><text x="448" y="128" font-size="13" font-weight="600" fill="#1f1e1b">2 AI 会場ビジュアライズ</text><text x="448" y="144" fill="#1f1e1b">配置データ → プロンプト → 生成</text><text x="448" y="160" fill="#1f1e1b">俯瞰ライティング図 + カメラ視点図</text><text x="448" y="176" fill="#1f1e1b">囲んで修正、版を保存</text></g><g><rect x="48" y="312" width="280" height="88" rx="8" fill="none" stroke="#8a8780" stroke-width="1.25"></rect><text x="64" y="336" font-size="13" font-weight="600" fill="#1f1e1b">3 現場の撮影管理</text><text x="64" y="352" fill="#1f1e1b">ショットリスト · ポーズ集</text><text x="64" y="368" fill="#1f1e1b">撮影日タイムラインと進捗ボード</text><text x="64" y="384" fill="#1f1e1b">ショットごとの開始・完了時刻を記録</text></g><g><rect x="432" y="312" width="280" height="88" rx="8" fill="none" stroke="#8a8780" stroke-width="1.25"></rect><text x="448" y="336" font-size="13" font-weight="600" fill="#1f1e1b">4 撮影ごとのセレクト</text><text x="448" y="352" fill="#1f1e1b">ショット別に分類 → 技術フィルタ</text><text x="448" y="368" fill="#1f1e1b">連写の重複整理 → 組内順位</text><text x="448" y="384" fill="#1f1e1b">ショットのカバー確認</text></g><g fill="none" stroke="#8a8780" stroke-width="1.25"><path d="M328 148H432" marker-end="url(#arch-arrow)"></path><path d="M128 192V312" marker-end="url(#arch-arrow)"></path><path d="M572 192V236H268V312" marker-end="url(#arch-arrow)"></path><path d="M328 336H432" marker-end="url(#arch-arrow)"></path></g><g><path d="M432 376H328" fill="none" stroke="#2f6fd6" stroke-width="2" marker-end="url(#arch-arrow-accent)"></path></g><text x="380" y="140" text-anchor="middle" fill="#6b6862">配置データ</text><text x="136" y="262" fill="#6b6862">人員 · 小道具 · 照明</text><text x="420" y="228" text-anchor="middle" fill="#6b6862">カメラ視点図</text><text x="380" y="328" text-anchor="middle" fill="#6b6862">番号 + 時間帯</text><text x="380" y="396" text-anchor="middle" font-weight="600" fill="#1f1e1b">撮り直し</text></svg>